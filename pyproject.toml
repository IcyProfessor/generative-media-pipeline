[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "genmedia-pipeline"
version = "0.3.0rc2"
description = "Recipe-based generative media pipeline with typed scene plans and resumable execution"
license = "MIT"
requires-python = ">=3.12,<3.15"
dependencies = [
  "pydantic>=2.10,<3",
  "PyYAML>=6.0.2,<7",
  "filelock>=3.16,<4",
  "moviepy==2.2.1",
  "Pillow>=10.4,<12",
  "numpy>=1.26,<3",
  "imageio-ffmpeg>=0.6,<1",
  "mutagen>=1.47,<2",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
live = ["google-genai>=2.0,<3", "httpx>=0.28,<1"]
queue = ["dramatiq[redis]>=2.0,<3"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "coverage>=7,<8"]

[project.scripts]
genmedia = "genmedia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["genmedia*"]

[tool.setuptools.package-data]
genmedia = ["data/assets/demo/*.json", "data/assets/demo/*.md", "data/assets/demo/characters/*.png", "data/assets/demo/backgrounds/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: renders actual video or executes queue workers"]

[tool.coverage.run]
source = ["genmedia"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
